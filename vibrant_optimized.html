<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CLINLO — Interactive 3D Biometric Explorer</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#e0f2fe">
  <link rel="preload" href="./models/podium.glb" as="fetch" crossorigin>
  <link rel="preload" href="./models/skinF2.glb" as="fetch" crossorigin>
  <link rel="preload" href="./texture/Plastic015A_1K-JPG_NormalGL.jpg" as="image" crossorigin>
  <link rel="preload" href="./map/GSG_PRO_STUDIOS_METAL_001_sm.webp" as="image" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    :root {
      --color-brand-white: #c9dcec;
      --color-brand-green: #0774c4;
      --color-brand-green-200: #88aafb;
      --color-brand-dark: #282f3c;
      --color-brand-white-200: #e5eaf8;
      --color-brand-blue-100: #a8bffd;
      --color-brand-purple-100: #d9cffb;
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(ellipse at 50% 50%, #dee9ff 0%, #c9dcec 40%, #b3ccee 75%, #a8bffd 100%);
      color: #0f172a;
      position: relative;
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    #clinical-drawer-wrapper, #clinical-card, #explore-card, #intro-overlay {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    /* Architectural hairline guidelines (Ground Truth Noomo) */
    .bg-guidelines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-guideline-h {
      position: absolute;
      top: 48%;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.45) 15%, rgba(255, 255, 255, 0.45) 85%, transparent 100%);
    }
    .bg-guideline-v {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 28%;
      width: 1px;
      background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.4) 15%, rgba(255, 255, 255, 0.4) 85%, transparent 100%);
    }
    .bg-crosshair {
      position: absolute;
      top: 48%;
      right: 28%;
      width: 17px;
      height: 17px;
      transform: translate(-50%, -50%);
    }
    .bg-crosshair::before, .bg-crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.75);
    }
    .bg-crosshair::before {
      top: 8px; left: 0; width: 17px; height: 1px;
    }
    .bg-crosshair::after {
      left: 8px; top: 0; height: 17px; width: 1px;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 2D Hotspot & Tag Layer */
    #tags-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      overflow: hidden;
    }

    /* Focus Ring for 3D Organ in Story View (Pages 12, 15, 19, 22) */
    #organ-focus-ring {
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.3);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 20;
    }
    #organ-focus-ring.active {
      opacity: 1;
      animation: ringPulse 2.8s infinite ease-in-out;
    }
    @keyframes ringPulse {
      0%, 100% {
        box-shadow: 0 0 24px rgba(255, 255, 255, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.3);
        opacity: 0.95;
      }
      50% {
        box-shadow: 0 0 38px rgba(255, 255, 255, 0.9), inset 0 0 18px rgba(255, 255, 255, 0.45);
        opacity: 0.70;
      }
    }

    /* Concentric Pulsing Target Rings on Body (Page 9 Overview) */
    /* Authentic Noomo Concentric Hotspots with clinlo Orbital Logo Morph */
    .circulo-contenedor,
    .concentric-hotspot {
      position: absolute;
      width: 80px;
      height: 80px;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      z-index: 28;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    .circulo-contenedor::before,
    .concentric-hotspot::before {
      border: 0.8px solid rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      content: "";
      height: 50px;
      width: 50px;
      left: 50%;
      top: 50%;
      position: absolute;
      transform: translate(-50%, -50%);
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
    }
    .circulo-contenedor::after,
    .concentric-hotspot::after {
      border: 0.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      content: "";
      height: 50px;
      width: 50px;
      left: 50%;
      top: 50%;
      position: absolute;
      transform: translate(-50%, -50%);
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      opacity: 0;
      pointer-events: none;
    }
    .circulo-contenedor:hover::before,
    .circulo-contenedor.is-hovered::before,
    .concentric-hotspot:hover::before,
    .concentric-hotspot.is-hovered::before {
      height: 64px;
      width: 64px;
      opacity: 0.65;
      border-color: rgba(255, 255, 255, 0.9);
    }
    .circulo-contenedor:hover::after,
    .circulo-contenedor.is-hovered::after,
    .concentric-hotspot:hover::after,
    .concentric-hotspot.is-hovered::after {
      height: 82px;
      width: 82px;
      opacity: 0.35;
    }
    .glow-bg {
      background: radial-gradient(circle, rgba(136, 170, 251, 0.75) 0px, rgba(136, 170, 251, 0) 70%);
      border-radius: 50%;
      height: 52px;
      width: 52px;
      left: 50%;
      top: 50%;
      position: absolute;
      transform: translate(-50%, -50%);
      opacity: 0.85;
      transition: opacity 0.4s;
      z-index: 5;
      pointer-events: none;
    }
    .circulo-contenedor:hover .glow-bg,
    .circulo-contenedor.is-hovered .glow-bg,
    .concentric-hotspot:hover .glow-bg,
    .concentric-hotspot.is-hovered .glow-bg {
      opacity: 0.25;
    }
    .circulo-principal {
      border-radius: 50%;
      height: 40px;
      width: 40px;
      position: relative;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circulo-principal::before {
      background: linear-gradient(135deg, rgb(232, 239, 255), rgb(193, 232, 255), rgb(255, 246, 254), rgb(230, 223, 255), rgb(255, 255, 255), rgb(213, 232, 255), rgb(246, 234, 255));
      border-radius: 50%;
      content: "";
      inset: 0px;
      -webkit-mask: linear-gradient(#fff 0 0) content-box exclude, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box exclude, linear-gradient(#fff 0 0);
      padding: 1.8px;
      position: absolute;
    }
    .circulo-contenedor:hover .circulo-principal,
    .circulo-contenedor.is-hovered .circulo-principal,
    .concentric-hotspot:hover .circulo-principal,
    .concentric-hotspot.is-hovered .circulo-principal {
      transform: scale(1.22);
    }
    .puntos-container {
      height: 100%;
      width: 100%;
      position: relative;
    }
    .punto {
      background-color: #ffffff;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      position: absolute;
      transform: translate(-50%, -50%);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.95);
    }
    .punto:first-child {
      height: 8px;
      width: 8px;
    }
    .punto:nth-child(2),
    .punto:nth-child(3) {
      height: 4px;
      width: 4px;
      opacity: 0;
    }
    .circulo-contenedor:hover .punto:first-child,
    .circulo-contenedor.is-hovered .punto:first-child,
    .concentric-hotspot:hover .punto:first-child,
    .concentric-hotspot.is-hovered .punto:first-child {
      height: 4px;
      width: 4px;
      transform: translate(-50%, -6px);
    }
    .circulo-contenedor:hover .punto:nth-child(2),
    .circulo-contenedor.is-hovered .punto:nth-child(2),
    .concentric-hotspot:hover .punto:nth-child(2),
    .concentric-hotspot.is-hovered .punto:nth-child(2) {
      opacity: 1;
      transform: translate(calc(-50% - 5px), calc(-50% + 4px));
    }
    .circulo-contenedor:hover .punto:nth-child(3),
    .circulo-contenedor.is-hovered .punto:nth-child(3),
    .concentric-hotspot:hover .punto:nth-child(3),
    .concentric-hotspot.is-hovered .punto:nth-child(3) {
      opacity: 1;
      transform: translate(calc(-50% + 5px), calc(-50% + 4px));
    }

    /* Floating Unified Capsule Hotspot Badges (Pages 11, 13, 16, 18, 20, 21) */
    .clinlo-capsule-hotspot {
      position: absolute;
      transform: translate(-24px, -50%);
      display: flex;
      align-items: center;
      gap: 12px;
      height: 48px;
      padding: 0 24px 0 4px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.90) 24%, rgba(255, 255, 255, 0.95) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 9999px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.10);
      cursor: pointer;
      pointer-events: auto;
      white-space: nowrap;
      z-index: 30;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s;
    }
    .clinlo-capsule-hotspot:hover {
      transform: translate(-24px, -50%) scale(1.04);
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.14);
    }
    .hotspot-target-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.9), inset 0 0 8px rgba(255, 255, 255, 0.5);
    }
    .hotspot-inner-pulse {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulseTargetInner 2.2s infinite ease-in-out;
    }
    .hotspot-center-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px #ffffff;
    }
    .hotspot-wave-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      animation: pulseTargetWave 2.2s infinite ease-out;
    }
    @keyframes pulseTargetInner {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes pulseTargetWave {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    .hotspot-label {
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
      letter-spacing: -0.01em;
    }

    /* GLOBAL HEADER CONTROLS */
    .top-header {
      position: absolute;
      top: 24px;
      left: 32px;
      right: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
      pointer-events: none;
    }
    .circular-back-btn {
      pointer-events: auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #0f172a;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.85);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .circular-back-btn.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }
    .circular-back-btn:hover {
      background: #ffffff;
      transform: scale(1.08);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
    }

    .gender-pill-box {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      border-radius: 9999px;
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .gender-btn {
      border: none;
      background: transparent;
      padding: 7px 20px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .gender-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    }

    .top-header-right {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }
    .btn-sound-toggle-studio {
      pointer-events: auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid #38bdf8;
      box-shadow: 
        0 4px 16px rgba(14, 165, 233, 0.18),
        inset 0 1px 1.5px rgba(255, 255, 255, 1);
      color: #0284c7;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }
    .btn-sound-toggle-studio:hover {
      background: #ffffff;
      border-color: #0284c7;
      transform: scale(1.06);
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.32), inset 0 1px 2px #ffffff;
    }
    .btn-sound-toggle-studio.sound-playing {
      border-color: #0284c7;
      box-shadow: 
        0 0 0 3px rgba(14, 165, 233, 0.2),
        0 6px 20px rgba(14, 165, 233, 0.3),
        inset 0 1px 1.5px #ffffff;
      animation: sound-pulse-studio 2s infinite ease-in-out;
    }
    @keyframes sound-pulse-studio {
      0%, 100% {
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2), 0 4px 16px rgba(14, 165, 233, 0.2);
      }
      50% {
        box-shadow: 0 0 0 5px rgba(14, 165, 233, 0.38), 0 8px 28px rgba(14, 165, 233, 0.45);
      }
    }
    .btn-sound-toggle-studio:focus-visible {
      outline: 2px solid #0284c7;
      outline-offset: 2px;
    }

    .top-right-logo {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 9999px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .top-right-logo.hidden {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    .top-right-logo:hover {
      background: #ffffff;
      transform: scale(1.04);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
    }
    .clinlo-logo-img {
      height: 22px;
      width: auto;
      max-height: 22px;
      object-fit: contain;
      display: block;
    }

    /* PAGE 10: INTRO STATE OVERLAY */
    #intro-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6vw;
      transition: opacity 0.5s, visibility 0.5s;
    }
    #intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .intro-left-title {
      pointer-events: auto;
      max-width: 480px;
    }
    .intro-brand-logo {
      height: 38px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
      margin-bottom: 24px;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(15, 23, 42, 0.06));
    }
    .intro-big-heading {
      font-size: clamp(48px, 6vw, 70px);
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -0.04em;
      background: linear-gradient(175deg, #09122c 0%, #172554 40%, #0369a1 80%, #0284c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.98)) drop-shadow(0 4px 18px rgba(14, 165, 233, 0.28));
    }
    .shine-text {
      display: inline-block;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 20%, #818cf8 45%, #c084fc 70%, #38bdf8 90%, #0284c7 100%);
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(56, 189, 248, 0.42));
      animation: liquidTextShimmer 7s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    @keyframes liquidTextShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .start-exp-wrapper {
      position: absolute;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      z-index: 40;
    }
    .start-exp-btn {
      position: relative;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96) 0%, rgba(240, 249, 255, 0.92) 100%);
      backdrop-filter: blur(32px) saturate(220%);
      -webkit-backdrop-filter: blur(32px) saturate(220%);
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.015em;
      padding: 16px 44px;
      border-radius: 9999px;
      border: 1.5px solid rgba(255, 255, 255, 1);
      border-top: 2px solid #ffffff;
      cursor: pointer;
      box-shadow: 
        0 18px 44px -6px rgba(14, 165, 233, 0.32),
        0 4px 16px rgba(15, 23, 42, 0.06),
        inset 0 2px 2.5px #ffffff,
        inset 0 -1.5px 3px rgba(186, 230, 253, 0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9);
    }
    .start-exp-btn::before {
      content: '';
      position: absolute;
      inset: -5px;
      border: 1.5px solid rgba(56, 189, 248, 0.55);
      border-radius: 9999px;
      animation: pulseButton 2.4s infinite ease-out;
      pointer-events: none;
    }
    @keyframes pulseButton {
      0% { transform: scale(0.98); opacity: 0.9; }
      100% { transform: scale(1.1); opacity: 0; }
    }
    .start-exp-btn:hover {
      transform: scale(1.04) translateY(-2px);
      background: #ffffff;
      box-shadow: 0 24px 54px rgba(14, 165, 233, 0.45), inset 0 2px 3px #ffffff;
    }

    .intro-right-list {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .intro-feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.015em;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-top: 2px solid #ffffff;
      border-radius: 9999px;
      box-shadow: 
        0 8px 24px -4px rgba(14, 165, 233, 0.12),

        height: 36px;
      }

        height: 175px;
      }

    @media (max-width: 380px) {

      material.customProgramCacheKey = () => 'dissolve_skin_' + id;
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uDissolve = material.userData.uDissolve;
        material.userData.shader = shader;

        shader.vertexShader = `
          varying vec2 vDissolveUv;
        ` + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace(
          '#include <uv_vertex>',
          `#include <uv_vertex>
           vDissolveUv = uv;`
        );

        shader.fragmentShader = `
          uniform float uDissolve;
          varying vec2 vDissolveUv;

          // Classic Perlin 3D Noise by Stefan Gustavson
          vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
          vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
          vec3 fade(vec3 t) {return t*t*t*(t*(t*6.0-15.0)+10.0);}

          float cnoise(vec3 P){
            vec3 Pi0 = floor(P);
            vec3 Pi1 = Pi0 + vec3(1.0);
            Pi0 = mod(Pi0, 289.0);
            Pi1 = mod(Pi1, 289.0);
            vec3 Pf0 = fract(P);
            vec3 Pf1 = Pf0 - vec3(1.0);
            vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
            vec4 iy = vec4(Pi0.yy, Pi1.yy);
            vec4 iz0 = Pi0.zzzz;
            vec4 iz1 = Pi1.zzzz;

            vec4 ixy = permute(permute(ix) + iy);
            vec4 ixy0 = permute(ixy + iz0);
            vec4 ixy1 = permute(ixy + iz1);

            vec4 gx0 = ixy0 / 7.0;
            vec4 gy0 = fract(floor(gx0) / 7.0) - 0.5;
            gx0 = fract(gx0);
            vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
            vec4 sz0 = step(gz0, vec4(0.0));
            gx0 -= sz0 * (step(0.0, gx0) - 0.5);
            gy0 -= sz0 * (step(0.0, gy0) - 0.5);

            vec4 gx1 = ixy1 / 7.0;
            vec4 gy1 = fract(floor(gx1) / 7.0) - 0.5;
            gx1 = fract(gx1);
            vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
            vec4 sz1 = step(gz1, vec4(0.0));
            gx1 -= sz1 * (step(0.0, gx1) - 0.5);
            gy1 -= sz1 * (step(0.0, gy1) - 0.5);

            vec3 g000 = vec3(gx0.x,gy0.x,gz0.x);
            vec3 g100 = vec3(gx0.y,gy0.y,gz0.y);
            vec3 g010 = vec3(gx0.z,gy0.z,gz0.z);
            vec3 g110 = vec3(gx0.w,gy0.w,gz0.w);
            vec3 g001 = vec3(gx1.x,gy1.x,gz1.x);
            vec3 g101 = vec3(gx1.y,gy1.y,gz1.y);
            vec3 g011 = vec3(gx1.z,gy1.z,gz1.z);
            vec3 g111 = vec3(gx1.w,gy1.w,gz1.w);

            vec4 norm0 = taylorInvSqrt(vec4(dot(g000, g000), dot(g010, g010), dot(g100, g100), dot(g110, g110)));
            g000 *= norm0.x;
            g010 *= norm0.y;
            g100 *= norm0.z;
            g110 *= norm0.w;
            vec4 norm1 = taylorInvSqrt(vec4(dot(g001, g001), dot(g011, g011), dot(g101, g101), dot(g111, g111)));
            g001 *= norm1.x;
            g011 *= norm1.y;
            g101 *= norm1.z;
            g111 *= norm1.w;

            float n000 = dot(g000, Pf0);
            float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
            float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
            float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
            float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
            float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
            float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
            float n111 = dot(g111, Pf1);

            vec3 fade_xyz = fade(Pf0);
            vec4 n_z = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fade_xyz.z);
            vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
            float n_xyz = mix(n_yz.x, n_yz.y, fade_xyz.x); 
            return 1.2 * n_xyz;
          }

             }
           }`
        );

    // State Machine: 'choose' | 'list' | 'slider' | 'story'

    let activeHotspotElements = [];

    function clearTags() {

      });

    function createConcentricRing(name, pos, categoryId) {
      const el = document.createElement('div');
      el.className = 'circulo-contenedor concentric-hotspot';
      el.setAttribute('data-cat', categoryId);

      activeHotspotElements.push({ element: el, pos: pos });

    function createFloatingTag(text, pos, hotspotKey) {
      const el = document.createElement('div');
      el.className = 'clinlo-capsule-hotspot';
      el.innerHTML = `
        <div class="hotspot-target-circle">
          <div class="hotspot-wave-ring"></div>

      el.onclick = () => openClinicalDrawer(hotspotKey);
      tagsLayer.appendChild(el);
      activeHotspotElements.push({ element: el, pos: pos });
    }

    // Zero-allocation projection vector and camera change caching (prevents layout thrashing & reflow)
    const _projVec = new THREE.Vector3();
    const _prevCamPos = new THREE.Vector3();
    const _prevCamQuat = new THREE.Quaternion();

    function updateTagsProjection(force = false) {
      // Check if camera or tilt actually moved; skip DOM updates when stationary to save 90% CPU
      const tiltDiff = Math.abs(hoverTiltState.deltaAz - hoverTiltState.targetDeltaAz) +
                       Math.abs(hoverTiltState.deltaPol - hoverTiltState.targetDeltaPol);
      const parallaxMoving = tiltDiff > 0.0001;
      const cameraMoving = activeCameraTweens > 0 || camera.position.distanceToSquared(_prevCamPos) > 0.000001 || !camera.quaternion.equals(_prevCamQuat);
      
      if (!force && !cameraMoving && !parallaxMoving) {
        return; // Zero CPU computation spent on stationary views
      }
      _prevCamPos.copy(camera.position);
      _prevCamQuat.copy(camera.quaternion);

      const halfW = window.innerWidth * 0.5;
      const halfH = window.innerHeight * 0.5;

      for (let i = 0; i < activeHotspotElements.length; i++) {
        const item = activeHotspotElements[i];
        _projVec.copy(item.pos).project(camera);
        if (_projVec.z > 1.0) {
          if (item.element.style.display !== 'none') item.element.style.display = 'none';
        } else {
          if (item.element.style.display !== 'flex') item.element.style.display = 'flex';
          const x = (_projVec.x * halfW) + halfW;
          const y = (-_projVec.y * halfH) + halfH;
          // GPU compositor translate3d with sub-pixel float formatting for liquid 60fps tracking
          const isCapsule = item.element.classList.contains('clinlo-capsule-hotspot');
          item.element.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) translate(${isCapsule ? '-24px' : '-50%'}, -50%)`;
        }
      }

      // Position Focus Ring around active organ in story mode
      if (currentState === 'story') {
        const cat = CATEGORIES[currentCategoryIndex];
        _projVec.copy(cat.focusPos).project(camera);
        const fx = (_projVec.x * halfW) + halfW;
        const fy = (-_projVec.y * halfH) + halfH;
        const scaleStr = focusRing.classList.contains('active') ? 'scale(1)' : 'scale(0.85)';
        focusRing.style.transform = `translate3d(${fx.toFixed(2)}px, ${fy.toFixed(2)}px, 0) translate(-50%, -50%) ${scaleStr}`;
      }
    }

    let currentVisibleOrganIds = [];
    let currentHoveredCategoryId = null;
    const organFadeTweens = {};
    const lightFadeTweens = {};

    function setOrganVisibility(visibleOrganIds, activeLights = []) {
      currentVisibleOrganIds = visibleOrganIds;

      for (const [id, mesh] of Object.entries(organs)) {
        const isTarget = visibleOrganIds.includes(id);
        const mat = organMaterials[id];
        if (organFadeTweens[id]) {
          organFadeTweens[id].kill();
          delete organFadeTweens[id];
        }
        if (isTarget) {
          mesh.visible = true;
          mesh.traverse(n => { if (n.isMesh) n.visible = true; });
          if (mat) {
            mat.depthWrite = true;
            if (mat.uniforms && mat.uniforms.opacity) {
              organFadeTweens[id] = gsap.to(mat.uniforms.opacity, {
                value: 1.0,
                duration: 0.40,
                ease: 'power2.out',
                overwrite: 'auto',
                onUpdate: () => { isDirty = true; }
              });
            }
          }
        } else {
          if (mat) {
            mat.depthWrite = false;
            if (mat.uniforms && mat.uniforms.opacity && mat.uniforms.opacity.value > 0.01) {
              organFadeTweens[id] = gsap.to(mat.uniforms.opacity, {
                value: 0.0,
                duration: 0.25,
                ease: 'power2.in',
                overwrite: 'auto',
                onUpdate: () => { isDirty = true; },
                onComplete: () => {
                  mesh.visible = false;
                  mesh.traverse(n => { if (n.isMesh) n.visible = false; });
                }
              });
            } else {
              if (mat.uniforms && mat.uniforms.opacity) mat.uniforms.opacity.value = 0.0;
              mesh.visible = false;
              mesh.traverse(n => { if (n.isMesh) n.visible = false; });
            }
          } else {
            mesh.visible = false;
            mesh.traverse(n => { if (n.isMesh) n.visible = false; });
          }
        }
      }

      const intensityMap = {
        brain: 1.4, heart: 1.4, liver: 1.1, kidneys: 1.3,
        intestine1: 0.6, intestine2: 0.5, thyroid: 1.1, dna: 1.2, cell: 1.2
      };

      // Selective light pruning with smooth cross-fading
      for (const [lId, light] of Object.entries(organBacklights)) {
        const isLit = activeLights.includes(lId);
        if (lightFadeTweens[lId]) {
          lightFadeTweens[lId].kill();
          delete lightFadeTweens[lId];
        }
        if (isLit) {
          light.visible = true;
          const targetInt = intensityMap[lId] || 1.0;
          lightFadeTweens[lId] = gsap.to(light, {
            intensity: targetInt,
            duration: 0.35,
            ease: 'power2.out',
            overwrite: 'auto',
            onUpdate: () => { isDirty = true; }
          });
        } else {
          if (light.intensity > 0.01) {
            lightFadeTweens[lId] = gsap.to(light, {
              intensity: 0.0,
              duration: 0.25,
              ease: 'power2.in',
              overwrite: 'auto',
              onUpdate: () => { isDirty = true; },
              onComplete: () => { light.visible = false; }
            });
          } else {
            light.intensity = 0.0;
            light.visible = false;
          }
        }
      }
      isDirty = true;
      requestFrame();
    }

    // Subtle organ hover reveal: reveals internal organ meshes with soft glowing fresnel highlight through translucent glass body

          lightFadeTweens[lId] = gsap.to(light, {
            intensity: targetInt,
            duration: 0.4,

    let activeCameraTweens = 0;
    function animateCamera(targetCam, targetLookAt, duration = 1.0) {
      hoverTiltState.enabled = false;
      hoverTiltState.targetDeltaAz = 0;
      hoverTiltState.targetDeltaPol = 0;
      hoverTiltState.deltaAz = 0;
      hoverTiltState.deltaPol = 0;
      quickAz(0);
      quickPol(0);

      gsap.killTweensOf([camera.position, controls.target]);
      activeCameraTweens = 1;
      isDirty = true;
      requestFrame();

      gsap.to(camera.position, {
        x: targetCam.x, y: targetCam.y, z: targetCam.z,
        duration: duration,
        ease: "power2.inOut",
        overwrite: "auto",
        onUpdate: () => {
          isDirty = true;
          controls.update();
        },
        onComplete: () => {
          activeCameraTweens = 0;
          controls.update();
          syncHoverTiltFromControls();
          hoverTiltState.enabled = true;
          if (hasActivePointer) {
            setTiltPointer(lastPointerNX, lastPointerNY);
          }
          isDirty = true;
          requestFrame();
        }
      });

      gsap.to(controls.target, {
        x: targetLookAt.x, y: targetLookAt.y, z: targetLookAt.z,
        duration: duration,
        ease: "power2.inOut",
        overwrite: "auto",
        onUpdate: () => { isDirty = true; }
      });
    }

          value: 0.0,
          duration: 1.8,
          ease: 'power2.inOut',
          overwrite: 'auto',
          onUpdate: () => { isDirty = true; requestFrame(); }
        });
        genderTweenFemale = gsap.to(skinMaterialFemale.userData.uDissolve, {
          value: 1.0,
          duration: 1.8,
          ease: 'power2.inOut',
          overwrite: 'auto',
          onUpdate: () => { isDirty = true; },
          onComplete: () => {
            if (currentGender === 'male') femaleAvatar.visible = false;
            genderTweenFemale = null;
            genderTweenMale = null;
          }
        });
      } else {
        femaleAvatar.visible = true;
        maleAvatar.visible = true;
        genderTweenFemale = gsap.to(skinMaterialFemale.userData.uDissolve, {
          value: 0.0,
          duration: 1.8,
          ease: 'power2.inOut',
          overwrite: 'auto',
          onUpdate: () => { isDirty = true; requestFrame(); }
        });
        genderTweenMale = gsap.to(skinMaterialMale.userData.uDissolve, {
          value: 1.0,
          duration: 1.8,
          ease: 'power2.inOut',
          overwrite: 'auto',
          onUpdate: () => { isDirty = true; },
          onComplete: () => {
            if (currentGender === 'female') maleAvatar.visible = false;
            genderTweenFemale = null;
            genderTweenMale = null;
          }
        });
      }
      isDirty = true;
      requestFrame();
    };

    // Default Ambient Sound Engine with Auto-Start, Synchronization & Polite Autoplay Fallback
    let studioAudio = null;
    let isStudioAudioPlaying = false;
    let userManuallyMuted = false;
    const isEmbeddedInIframe = (window.self !== window.top);

    function initStudioAudio() {
      if (!studioAudio) {
        studioAudio = new Audio('./audio/Music.mp3');
        studioAudio.loop = true;
        // In iframe mode, keep local Audio muted to prevent duplicate audio echo with parent index.html
        studioAudio.volume = isEmbeddedInIframe ? 0 : 0.45;
      }
    }

    function updateStudioSoundUI(playing) {
      const btn = document.getElementById('studio-sound-toggle');
      if (!btn) return;
      const iconMuted = btn.querySelector('.sound-icon-muted');
      const iconActive = btn.querySelector('.sound-icon-active');
      if (playing) {
        btn.classList.add('sound-playing');
        btn.classList.remove('muted');
        btn.setAttribute('aria-label', 'Mute Ambient Sound');
        btn.setAttribute('title', 'Sound On (Click to Mute)');
        if (iconMuted) iconMuted.style.display = 'none';
        if (iconActive) iconActive.style.display = 'block';
      } else {
        btn.classList.remove('sound-playing');
        btn.classList.add('muted');
        btn.setAttribute('aria-label', 'Unmute Ambient Sound');
        btn.setAttribute('title', 'Sound Off (Click to Play)');
        if (iconMuted) iconMuted.style.display = 'block';
        if (iconActive) iconActive.style.display = 'none';
      }
    }

    function toggleStudioSound() {
      if (isEmbeddedInIframe) {
        userManuallyMuted = !isStudioAudioPlaying;
        // Forward toggle request to parent index.html to keep all 3 buttons in sync
        try {
          window.parent.postMessage({ type: 'CLINLO_AUDIO_TOGGLE' }, '*');
        } catch (e) {
          console.warn('PostMessage to parent failed:', e);
        }
        return;
      }
      initStudioAudio();
      if (!studioAudio) return;
      if (studioAudio.paused) {
        userManuallyMuted = false;
        studioAudio.play().then(() => {
          isStudioAudioPlaying = true;
          updateStudioSoundUI(true);
        }).catch(err => {
          console.warn('Audio play prevented:', err);
          updateStudioSoundUI(false);
        });
      } else {
        userManuallyMuted = true;
        studioAudio.pause();
        isStudioAudioPlaying = false;
        updateStudioSoundUI(false);
      }
    }

    function startAmbientSound() {
      if (userManuallyMuted) return; // Respect explicit user mute preference
      if (isEmbeddedInIframe) {
        try {
          window.parent.postMessage({ type: 'CLINLO_AUDIO_SET', playing: true }, '*');
        } catch (e) {}
        return;
      }
      initStudioAudio();
      if (studioAudio && studioAudio.paused && !userManuallyMuted) {
        studioAudio.play().then(() => {
          isStudioAudioPlaying = true;
          updateStudioSoundUI(true);
        }).catch(() => {
          updateStudioSoundUI(false);
        });
      }
    }

    window.toggleStudioSound = toggleStudioSound;
    window.toggleSound = toggleStudioSound;

    // Listen for audio synchronization commands from parent index.html
    window.addEventListener('message', (event) => {
      if (!event.data) return;
      if (event.data.type === 'CLINLO_AUDIO_SYNC') {
        const playing = !!event.data.playing;
        isStudioAudioPlaying = playing;
        userManuallyMuted = !playing;
        updateStudioSoundUI(playing);
        if (!isEmbeddedInIframe && studioAudio) {
          if (playing && studioAudio.paused) {
            studioAudio.play().catch(() => {});
          } else if (!playing && !studioAudio.paused) {
            studioAudio.pause();
          }
        }
      }
    });

    if (isEmbeddedInIframe) {
      try {
        window.parent.postMessage({ type: 'CLINLO_AUDIO_REQUEST_STATE' }, '*');
      } catch (e) {}
    }

    // Smart Power-Aware Demand-Driven Render & Animation Engine with Resilient Lifecycle Guards
    let isTabVisible = !document.hidden;
    let isCanvasVisible = true;
    let isRenderingActive = false;
    let isContextLost = false;
    let isDirty = true;
    let lastInteractionTime = performance.now();
    let lastFrameTime = performance.now();

    const TARGET_FRAME_MS = 1000 / 60; // 60fps target during interaction
    const LOW_POWER_FRAME_MS = 1000 / 30; // 30fps low-power pacing for subtle breath

    function requestFrame() {
      lastInteractionTime = performance.now();
      isDirty = true;
      if (!isRenderingActive && isTabVisible && isCanvasVisible && !isContextLost) {
        lastFrameTime = performance.now();
        isRenderingActive = true;
        requestAnimationFrame(animate);
      }
    }
    window.requestFrame = requestFrame;

    function animate(currentTime = performance.now()) {
      if (!isTabVisible || !isCanvasVisible || isContextLost) {
        isRenderingActive = false;
        return; // Zero CPU & GPU compute when tab is hidden, scrolled out of view, or WebGL context lost
      }

      const hasActiveOrgan = (currentVisibleOrganIds && currentVisibleOrganIds.length > 0);
      const isMotionActive = (activeCameraTweens > 0);

      // Tilt motion settle check
      const tiltDiff = Math.abs(hoverTiltState.deltaAz - hoverTiltState.targetDeltaAz) +
                       Math.abs(hoverTiltState.deltaPol - hoverTiltState.targetDeltaPol);
      const isTiltMoving = tiltDiff > 0.0001;

      // Smart idle condition: keep rendering during active camera motion, pointer tilt, gender dissolve, hovered organ, or active organ views
      // In static choose and list overview modes, gracefully sleep to 0.0 FPS
      let needsNextFrame = false;
      if (isTiltMoving) needsNextFrame = true;
      if (isMotionActive) needsNextFrame = true;
      if (currentHoveredCategoryId) needsNextFrame = true;
      if (genderTweenFemale || genderTweenMale) needsNextFrame = true;
      if (hasActiveOrgan) needsNextFrame = true;

      if (!needsNextFrame && !isDirty) {
        // Scene has completely settled! Sleep render loop (0.0% CPU & GPU)
        isRenderingActive = false;
        updateTagsProjection(true); // Final projection lock
        return;
      }

      isRenderingActive = true;
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      // Authentic DNA double helix spin around longitudinal axis (only active when genetics view visible)
      // Natural forward rotation matching biological right-handed B-DNA helix
      if (dnaMeshNode && organs['dna'] && organs['dna'].visible) {
        dnaMeshNode.rotateZ(delta * 0.25);
      }

      // Subtle organic breathing pulse on actively visible organ materials only (O(1) with cached baseScale)
      const pulseTime = clock.getElapsedTime();
      for (let i = 0; i < currentVisibleOrganIds.length; i++) {
        const id = currentVisibleOrganIds[i];
        const sMat = organMaterials[id];
        if (sMat && sMat.uniforms && sMat.uniforms.thicknessScale) {
          const baseScale = sMat._baseScale || 20.0;
          sMat.uniforms.thicknessScale.value = baseScale + Math.sin(pulseTime * 2.2) * (baseScale * 0.12);
        }
      }

      // Smooth hover tilt around controls.target (only active when camera tweens are settled)
      if (!isMotionActive) {
        updateHoverTilt();
      }

      controls.update();
      renderer.render(scene, camera);
      updateTagsProjection();

      isDirty = false;
    }

    // Tab Backgrounding & Visibility Change
    document.addEventListener('visibilitychange', () => {
      isTabVisible = !document.hidden;
      if (isTabVisible) {
        clock.getDelta();
        requestFrame();
      } else {
        isRenderingActive = false;
      }
    });

    // IntersectionObserver for iframe / viewport scrolling
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          isCanvasVisible = entry.isIntersecting;
          if (isCanvasVisible) {
            requestFrame();
          } else {
            isRenderingActive = false;
          }
        });
      }, { threshold: 0.05 });
      observer.observe(canvas);
    }

    // WebGL Context Loss & Restoration Guard (Mobile device switching & background memory reclamation)
    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      console.warn('WebGL context lost! Halting render loop & entering resilient standby...');
      isContextLost = true;
      isRenderingActive = false;
    }, false);

    canvas.addEventListener('webglcontextrestored', () => {
      console.info('WebGL context restored! Re-uploading textures and shaders to GPU...');
      isContextLost = false;

      scene.traverse((obj) => {
        if (obj.isMesh && obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach(mat => {
            mat.needsUpdate = true;
            for (const key in mat) {
              if (mat[key] && mat[key].isTexture) {
                mat[key].needsUpdate = true;
              }
            }
          });
        }
      });

      if (scene.environment) {
        scene.environment.needsUpdate = true;
      }

      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(maxDPR);
      isDirty = true;
      requestFrame();
    }, false);

    // Initial loop trigger
    requestFrame();

    // Window Resize Handling (Adaptive physical display resolution & re-profiling)
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(maxDPR);
      isDirty = true;
      requestFrame();
    });
  </script>
<script>
    const clinicalDrawerWrapper = document.getElementById('clinical-drawer-wrapper');
    if (clinicalDrawerWrapper) {
      clinicalDrawerWrapper.addEventListener('scroll', () => requestFrame(), { passive: true });
    }

    // PWA Service Worker Registration for Instant Zero-Latency 3D Asset Streaming
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(() => {
          console.log('[PWA] OSGYM 3D ServiceWorker active & pre-caching assets');
        }).catch((err) => {
          console.log('[PWA] ServiceWorker note:', err);
        });
      });
    }

    // Battery Status API & Thermal Saver Awareness
    if (navigator.getBattery) {
      navigator.getBattery().then(battery => {
        const checkBattery = () => {
          if (battery.level < 0.20 && !battery.charging) {
            console.log('[Power] Low battery mode active: throttling motion DPR');
            if (window.hardwareProfile) {
              window.hardwareProfile.motionDPR = 0.85;
            }
          }
        };
        battery.addEventListener('levelchange', checkBattery);
        battery.addEventListener('chargingchange', checkBattery);
        checkBattery();
      }).catch(() => {});
    }
</script>
